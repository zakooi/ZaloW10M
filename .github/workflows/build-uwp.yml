name: Build UWP for Windows 10 Mobile (ARM)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore ZaloW10M.sln

    - name: Build and Package UWP (ARM Release)
      run: |
        msbuild ZaloW10M\ZaloW10M.csproj /p:Configuration=Release `
                                         /p:Platform=ARM `
                                         /p:AppxBundle=Always `
                                         /p:AppxBundlePlatforms="ARM" `
                                         /p:UapAppxPackageBuildMode=SideLoadOnly `
                                         /p:AppxPackageSigningEnabled=false

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZaloW10M-ARM-Package
        path: ZaloW10M/AppPackages/**/*