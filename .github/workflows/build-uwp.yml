name: Build UWP for Windows 10 Mobile (ARM)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore ZaloW10M.sln

    - name: Build and Package UWP (ARM Release)
      run: |
        msbuild ZaloW10M.sln /p:Configuration=Release `
                             /p:Platform=ARM `
                             /p:AppxPackageDir="D:\a\ZaloW10M\ZaloW10M\AppPackages\" `
                             /p:AppxBundle=Always `
                             /p:AppxBundlePlatforms="ARM" `
                             /p:UapAppxPackageBuildMode=SideLoadOnly `
                             /p:AppxPackageSigningEnabled=false `
                             /fl /flp:logfile=msbuild.log;verbosity=normal

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ZaloW10M-Build-Output
        path: |
          AppPackages/**/*
          msbuild.log