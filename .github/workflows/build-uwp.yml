name: Build UWP for Windows 10 Mobile (ARM)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: |
        nuget restore ZaloW10M.sln
        msbuild ZaloW10M.sln /t:Restore /p:Platform=ARM

    - name: Create test signing certificate
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=ZaloW10M" `
          -KeyUsage DigitalSignature -KeyExportPolicy Exportable -FriendlyName "ZaloW10M test signing" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        $password = ConvertTo-SecureString -String "zalo-appx-test" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "$($env:GITHUB_WORKSPACE)\ZaloW10M_Test.pfx" -Password $password | Out-Null
        Export-Certificate -Cert $cert -FilePath "$($env:GITHUB_WORKSPACE)\ZaloW10M_Test.cer" | Out-Null
        Write-Host "Created certificate: $($cert.Subject)"

    - name: Build and Package UWP (ARM Release)
      shell: powershell
      run: |
        $pfx = "$($env:GITHUB_WORKSPACE)\ZaloW10M_Test.pfx"
        $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP"
        $tpv = Get-ChildItem $sdkRoot -Directory |
          Where-Object { $_.Name -match '^10\.' } |
          Sort-Object { [version]$_.Name } -Descending |
          Select-Object -First 1 -ExpandProperty Name
        if (-not $tpv) { throw "No UAP SDK found under $sdkRoot" }
        Write-Host "Using TargetPlatformVersion $tpv"

        & msbuild ZaloW10M.sln `
          /p:Configuration=Release `
          /p:Platform=ARM `
          "/p:AppxPackageDir=$($env:GITHUB_WORKSPACE)\AppPackages\" `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms=ARM `
          /p:UapAppxPackageBuildMode=SideLoadOnly `
          /p:AppxPackageSigningEnabled=true `
          "/p:PackageCertificateKeyFile=$pfx" `
          /p:PackageCertificatePassword=zalo-appx-test `
          "/p:TargetPlatformVersion=$tpv" `
          /fl "/flp:logfile=msbuild.log;verbosity=normal"
        if ($LASTEXITCODE -ne 0) {
            Write-Host "=== MSBUILD ERROR LOG ==="
            if (Test-Path msbuild.log) {
                Get-Content msbuild.log | Select-String -Pattern "error", "MSB", "FAILED" -Context 2,2
            }
            exit 1
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ZaloW10M-Build-Output
        path: |
          AppPackages/**/*
          ZaloW10M_Test.cer
          msbuild.log